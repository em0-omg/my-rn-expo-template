# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: npx expo lint --fix {staged_files}
      stage_fixed: true
    format:
      glob: '*.{js,ts,jsx,tsx,json,md}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
